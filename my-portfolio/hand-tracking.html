<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Hand Tracking Space</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: system-ui, -apple-system, sans-serif;
            overflow: hidden;
            background: #000;
        }
        #container {
            position: absolute;
            inset: 0;
        }
        #video {
            display: none;
        }
        #canvas {
            position: absolute;
            top: 16px;
            right: 16px;
            width: 320px;
            height: 240px;
            border: 2px solid rgba(78, 205, 196, 0.5);
            border-radius: 8px;
            background: #000;
        }
        .ui-overlay {
            position: absolute;
            top: 16px;
            left: 16px;
            display: flex;
            flex-direction: column;
            gap: 8px;
            z-index: 10;
        }
        .status-badge {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 10px 16px;
            border-radius: 8px;
            backdrop-filter: blur(10px);
            color: white;
            font-size: 14px;
            font-weight: 500;
            transition: all 0.3s;
        }
        .status-inactive {
            background: rgba(0, 0, 0, 0.6);
            color: #999;
        }
        .status-active {
            background: rgba(78, 205, 196, 0.3);
            color: #4ecdc4;
            box-shadow: 0 0 20px rgba(78, 205, 196, 0.3);
        }
        .status-camera {
            background: rgba(0, 255, 0, 0.3);
            color: #0f0;
        }
        .instructions {
            position: absolute;
            bottom: 24px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 16px 32px;
            border-radius: 12px;
            backdrop-filter: blur(10px);
            color: white;
            font-size: 14px;
            text-align: center;
            border: 1px solid rgba(78, 205, 196, 0.3);
        }
        .loading {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
            flex-direction: column;
            gap: 24px;
            color: white;
        }
        .spinner {
            width: 60px;
            height: 60px;
            border: 5px solid rgba(78, 205, 196, 0.2);
            border-top-color: #4ecdc4;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .loading h2 {
            font-size: 24px;
            font-weight: 600;
        }
        .loading p {
            font-size: 14px;
            color: #999;
        }
        .error {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            z-index: 100;
        }
        .error-box {
            background: rgba(255, 0, 0, 0.15);
            border: 2px solid #ff0000;
            border-radius: 12px;
            padding: 32px;
            max-width: 500px;
            color: white;
        }
        .error-box h3 {
            margin-bottom: 16px;
            color: #ff6b6b;
            font-size: 20px;
        }
        .error-box p {
            line-height: 1.6;
            margin-bottom: 8px;
        }
        .error-box button {
            margin-top: 20px;
            padding: 12px 24px;
            background: #4ecdc4;
            border: none;
            border-radius: 6px;
            color: #000;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }
        .error-box button:hover {
            background: #3dbdb3;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div id="container"></div>
    <video id="video" autoplay playsinline muted></video>
    <canvas id="canvas" width="640" height="480"></canvas>
    
    <div class="ui-overlay">
        <div id="camera-status" class="status-badge status-inactive">
            📹 Starting Camera...
        </div>
        <div id="hand-status" class="status-badge status-inactive">
            ✋ Show Your Hand
        </div>
        <div id="debug-status" class="status-badge status-inactive" style="font-size: 12px;">
            Initializing...
        </div>
    </div>
    
    <div class="instructions">
        <strong>👆 Point your index finger</strong> to control the planets
    </div>
    
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <h2>Loading Hand Tracking</h2>
        <p id="loading-text">Initializing...</p>
    </div>
    
    <div id="error" class="error" style="display: none;">
        <div class="error-box">
            <h3>❌ Error</h3>
            <p id="error-message"></p>
            <button onclick="location.reload()">🔄 Reload Page</button>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "@mediapipe/tasks-vision": "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/vision_bundle.mjs"
        }
    }
    </script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script type="module">
        import { HandLandmarker, FilesetResolver } from "@mediapipe/tasks-vision";

        let scene, camera, renderer, planets = [], stars = [];
        let handLandmarker;
        let lastHandData = null;
        let video, canvas, canvasCtx;
        let lastVideoTime = -1;

        const updateDebug = (text) => {
            document.getElementById('debug-status').textContent = text;
            document.getElementById('loading-text').textContent = text;
            console.log('📍', text);
        };

        const showError = (message) => {
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'flex';
            document.getElementById('error-message').textContent = message;
        };

        async function init() {
            try {
                updateDebug('Initializing 3D scene...');

                // Three.js setup
                const container = document.getElementById('container');
                scene = new THREE.Scene();
                scene.fog = new THREE.FogExp2(0x000000, 0.002);
                
                camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
                camera.position.z = 60;

                renderer = new THREE.WebGLRenderer({ antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                renderer.setClearColor(0x000000, 1);
                container.appendChild(renderer.domElement);

                // Add ambient light
                const ambientLight = new THREE.AmbientLight(0x404040, 0.5);
                scene.add(ambientLight);

                // Starfield with varying sizes
                const createStarfield = () => {
                    const geometry = new THREE.BufferGeometry();
                    const vertices = [];
                    const colors = [];
                    const sizes = [];
                    
                    for (let i = 0; i < 5000; i++) {
                        vertices.push(
                            (Math.random() - 0.5) * 300,
                            (Math.random() - 0.5) * 300,
                            (Math.random() - 0.5) * 300
                        );
                        
                        // Vary star colors (white to pale blue)
                        const color = new THREE.Color();
                        color.setHSL(0.6, Math.random() * 0.3, 0.8 + Math.random() * 0.2);
                        colors.push(color.r, color.g, color.b);
                        
                        // Vary sizes
                        sizes.push(Math.random() * 2 + 0.5);
                    }
                    
                    geometry.setAttribute('position', new THREE.Float32BufferAttribute(vertices, 3));
                    geometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                    geometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
                    
                    const material = new THREE.PointsMaterial({
                        size: 1,
                        vertexColors: true,
                        transparent: true,
                        opacity: 0.9,
                        sizeAttenuation: true
                    });
                    
                    const starField = new THREE.Points(geometry, material);
                    scene.add(starField);
                    stars.push(starField);
                };

                createStarfield();

                // Create advanced planet with glow
                const createPlanet = (size, color, glowColor, x, y, z, particleCount, particleSpread) => {
                    const group = new THREE.Group();
                    
                    // Main planet sphere with gradient-like appearance
                    const geometry = new THREE.SphereGeometry(size, 64, 64);
                    
                    // Create custom shader material for glowing effect
                    const material = new THREE.MeshBasicMaterial({ 
                        color: color,
                        transparent: true,
                        opacity: 0.95
                    });
                    
                    const planet = new THREE.Mesh(geometry, material);
                    group.add(planet);
                    
                    // Add glow sphere
                    const glowGeometry = new THREE.SphereGeometry(size * 1.1, 32, 32);
                    const glowMaterial = new THREE.MeshBasicMaterial({
                        color: glowColor,
                        transparent: true,
                        opacity: 0.15,
                        side: THREE.BackSide
                    });
                    const glow = new THREE.Mesh(glowGeometry, glowMaterial);
                    group.add(glow);
                    
                    // Create multiple particle layers
                    const particleLayers = [];
                    
                    for (let layer = 0; layer < 3; layer++) {
                        const particlesGeometry = new THREE.BufferGeometry();
                        const positions = [];
                        const colors = [];
                        const sizes = [];
                        
                        const layerParticleCount = Math.floor(particleCount / 3);
                        const layerRadius = size + particleSpread * (layer + 1) / 3;
                        
                        for (let i = 0; i < layerParticleCount; i++) {
                            const theta = Math.random() * Math.PI * 2;
                            const phi = Math.random() * Math.PI;
                            const r = layerRadius + (Math.random() - 0.5) * particleSpread * 0.3;
                            
                            positions.push(
                                r * Math.sin(phi) * Math.cos(theta),
                                r * Math.sin(phi) * Math.sin(theta),
                                r * Math.cos(phi)
                            );
                            
                            // Color variation
                            const c = new THREE.Color(color);
                            c.offsetHSL(0, (Math.random() - 0.5) * 0.2, (Math.random() - 0.5) * 0.3);
                            colors.push(c.r, c.g, c.b);
                            
                            // Size variation
                            sizes.push(Math.random() * 0.3 + 0.1);
                        }
                        
                        particlesGeometry.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
                        particlesGeometry.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
                        particlesGeometry.setAttribute('size', new THREE.Float32BufferAttribute(sizes, 1));
                        
                        const particlesMaterial = new THREE.PointsMaterial({
                            size: 0.15,
                            vertexColors: true,
                            transparent: true,
                            opacity: 0.7 - layer * 0.2,
                            sizeAttenuation: true,
                            blending: THREE.AdditiveBlending
                        });
                        
                        const particleSystem = new THREE.Points(particlesGeometry, particlesMaterial);
                        particleSystem.userData.rotationSpeed = 0.002 * (layer + 1);
                        group.add(particleSystem);
                        particleLayers.push(particleSystem);
                    }
                    
                    // Add point light for each planet
                    const light = new THREE.PointLight(glowColor, 1, 50);
                    light.position.set(0, 0, 0);
                    group.add(light);
                    
                    group.position.set(x, y, z);
                    scene.add(group);
                    
                    return { 
                        group, 
                        planet, 
                        glow,
                        particles: particleLayers, 
                        light,
                        originalPos: { x, y, z } 
                    };
                };

                // Create planets with different characteristics
                planets.push(createPlanet(4, 0xffd700, 0xffeb99, -20, 8, 15, 1500, 3));  // Gold planet
                planets.push(createPlanet(3.5, 0xff6b6b, 0xff9999, 15, -10, 8, 1200, 2.5));  // Red planet
                planets.push(createPlanet(3, 0x4ecdc4, 0x7ee8df, 0, 12, 5, 1000, 2));  // Cyan planet
                planets.push(createPlanet(2.5, 0xffe66d, 0xfff0a8, -12, -8, -5, 800, 1.8));  // Yellow planet
                planets.push(createPlanet(2, 0xa569bd, 0xc39bd3, 18, 5, -10, 600, 1.5));  // Purple planet

                updateDebug('Requesting camera access...');

                // Camera setup
                video = document.getElementById('video');
                canvas = document.getElementById('canvas');
                canvasCtx = canvas.getContext('2d');

                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'user',
                        width: { ideal: 1280 },
                        height: { ideal: 720 }
                    }
                });
                
                video.srcObject = stream;
                await new Promise(resolve => {
                    video.onloadedmetadata = () => {
                        video.play();
                        resolve();
                    };
                });
                
                document.getElementById('camera-status').textContent = '📹 Camera Active';
                document.getElementById('camera-status').className = 'status-badge status-camera';
                
                updateDebug('Loading MediaPipe Hand Landmarker...');

                // Initialize MediaPipe Hand Landmarker
                const vision = await FilesetResolver.forVisionTasks(
                    "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
                );

                handLandmarker = await HandLandmarker.createFromOptions(vision, {
                    baseOptions: {
                        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
                        delegate: "GPU"
                    },
                    numHands: 2,
                    runningMode: "VIDEO",
                    minHandDetectionConfidence: 0.5,
                    minHandPresenceConfidence: 0.5,
                    minTrackingConfidence: 0.5
                });
                
                updateDebug('Hand tracking ready!');
                document.getElementById('loading').style.display = 'none';

                // Start detection and animation
                detectHands();
                animate();

                // Handle window resize
                window.addEventListener('resize', () => {
                    camera.aspect = window.innerWidth / window.innerHeight;
                    camera.updateProjectionMatrix();
                    renderer.setSize(window.innerWidth, window.innerHeight);
                });

            } catch (error) {
                console.error('❌ Error:', error);
                showError(`${error.message || 'Failed to initialize.'}\n\nPlease check camera permissions and reload.`);
            }
        }

        function detectHands() {
            if (video.currentTime !== lastVideoTime) {
                lastVideoTime = video.currentTime;
                
                const results = handLandmarker.detectForVideo(video, performance.now());
                
                // Clear canvas
                canvasCtx.save();
                canvasCtx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Draw video feed (mirrored)
                canvasCtx.scale(-1, 1);
                canvasCtx.drawImage(video, -canvas.width, 0, canvas.width, canvas.height);
                canvasCtx.restore();
                
                if (results.landmarks && results.landmarks.length > 0) {
                    document.getElementById('hand-status').textContent = '✋ Hand Detected';
                    document.getElementById('hand-status').className = 'status-badge status-active';
                    
                    lastHandData = results.landmarks[0];
                    
                    // Draw hand landmarks
                    for (const landmarks of results.landmarks) {
                        // Draw connections
                        const connections = [
                            [0,1],[1,2],[2,3],[3,4],
                            [0,5],[5,6],[6,7],[7,8],
                            [0,9],[9,10],[10,11],[11,12],
                            [0,13],[13,14],[14,15],[15,16],
                            [0,17],[17,18],[18,19],[19,20],
                            [5,9],[9,13],[13,17]
                        ];
                        
                        canvasCtx.strokeStyle = 'rgba(0, 255, 0, 0.5)';
                        canvasCtx.lineWidth = 2;
                        
                        connections.forEach(([start, end]) => {
                            const startPoint = landmarks[start];
                            const endPoint = landmarks[end];
                            
                            canvasCtx.beginPath();
                            canvasCtx.moveTo((1 - startPoint.x) * canvas.width, startPoint.y * canvas.height);
                            canvasCtx.lineTo((1 - endPoint.x) * canvas.width, endPoint.y * canvas.height);
                            canvasCtx.stroke();
                        });
                        
                        // Draw points
                        landmarks.forEach((landmark, i) => {
                            const x = (1 - landmark.x) * canvas.width;
                            const y = landmark.y * canvas.height;
                            
                            canvasCtx.fillStyle = i === 8 ? 'rgba(78, 205, 196, 0.9)' : 'rgba(255, 0, 0, 0.8)';
                            canvasCtx.beginPath();
                            canvasCtx.arc(x, y, i === 8 ? 8 : 4, 0, 2 * Math.PI);
                            canvasCtx.fill();
                        });
                    }
                } else {
                    document.getElementById('hand-status').textContent = '✋ Show Your Hand';
                    document.getElementById('hand-status').className = 'status-badge status-inactive';
                    lastHandData = null;
                }
            }
            
            requestAnimationFrame(detectHands);
        }

        function animate() {
            requestAnimationFrame(animate);

            const time = Date.now() * 0.001;

            // Rotate planets and their particle systems
            planets.forEach((p, i) => {
                p.group.rotation.y += 0.0008 * (i + 1);
                p.planet.rotation.y += 0.002;
                p.glow.rotation.y -= 0.001;
                
                // Rotate each particle layer at different speeds
                p.particles.forEach((particleLayer, layerIndex) => {
                    particleLayer.rotation.y += particleLayer.userData.rotationSpeed;
                    particleLayer.rotation.x += particleLayer.userData.rotationSpeed * 0.5;
                });
                
                // Gentle bobbing motion
                p.group.position.y += Math.sin(time + i) * 0.01;
            });

            // Rotate starfield slowly
            stars.forEach(s => {
                s.rotation.y += 0.0001;
                s.rotation.x += 0.00005;
            });

            // Update planet positions based on hand
            if (lastHandData) {
                const indexTip = lastHandData[8];
                
                const x = (indexTip.x - 0.5) * 100;
                const y = -(indexTip.y - 0.5) * 70;
                const z = indexTip.z ? indexTip.z * 60 : 0;
                
                planets.forEach((p, i) => {
                    const offset = i * 2;
                    const targetX = x + Math.sin(time * 0.5 + offset) * 8;
                    const targetY = y + Math.cos(time * 0.5 + offset) * 8;
                    const targetZ = z + i * 4;
                    
                    p.group.position.x += (targetX - p.group.position.x) * 0.08;
                    p.group.position.y += (targetY - p.group.position.y) * 0.08;
                    p.group.position.z += (targetZ - p.group.position.z) * 0.08;
                });
            } else {
                // Return to original positions
                planets.forEach(p => {
                    p.group.position.x += (p.originalPos.x - p.group.position.x) * 0.03;
                    p.group.position.y += (p.originalPos.y - p.group.position.y) * 0.03;
                    p.group.position.z += (p.originalPos.z - p.group.position.z) * 0.03;
                });
            }

            renderer.render(scene, camera);
        }

        // Start when page loads
        window.addEventListener('load', init);
    </script>
</body>
</html>
