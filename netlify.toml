# Netlify build configuration.
#
# The git root is this directory (RonakPortal/), but the site itself lives one
# level down in my-portfolio/. Without `base`, Netlify runs the build at the
# repo root — where there is no package.json — and then publishes a `dist` that
# doesn't exist, which serves a 404 for every path including static assets.
#
# Keeping this in the repo rather than only in the Netlify dashboard means the
# settings are versioned and can't silently drift. netlify.toml takes
# precedence over the dashboard's build settings.

[build]
  base = "my-portfolio"
  command = "npm run build"
  # Relative to `base`, so this resolves to my-portfolio/dist
  publish = "dist"

[build.environment]
  # vite 7 requires node ^20.19.0 || >=22.12.0. Netlify's default is older than
  # that on existing sites, which fails the build outright.
  NODE_VERSION = "22"

# Deliberately no SPA catch-all. The usual `/* -> /index.html 200` rule exists
# to make client-side *URL* routes work, and this app has none — it routes in
# component state, so "/" is the only real document. With the catch-all in
# place every missing file answered 200 with the app's HTML instead of 404,
# which silently hides broken asset links (a renamed video still "works" until
# someone notices the page is being served in its place).
